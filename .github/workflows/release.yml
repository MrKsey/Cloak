on:
  push:
    tags:
      - 'v*'

name: Create Release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # ck-client targets
          - target: linux-amd64
            goos: linux
            goarch: amd64
            cmd: ck-client
          - target: linux-arm64
            goos: linux
            goarch: arm64
            cmd: ck-client
          - target: windows-amd64
            goos: windows
            goarch: amd64
            cmd: ck-client
          # ck-server targets
          - target: linux-amd64
            goos: linux
            goarch: amd64
            cmd: ck-server
          - target: linux-arm64
            goos: linux
            goarch: arm64
            cmd: ck-server
          - target: windows-amd64
            goos: windows
            goarch: amd64
            cmd: ck-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.24'
      - name: Build ${{ matrix.cmd }} for ${{ matrix.target }}
        run: |
          mkdir -p release
          VERSION=${GITHUB_REF#refs/*/}
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "release/${{ matrix.cmd }}-${{ matrix.target }}${EXT}" ./cmd/${{ matrix.cmd }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}-${{ matrix.cmd }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            release/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
